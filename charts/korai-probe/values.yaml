# The install token from Korai (Uptime checks > Private probes > Add private probe). It is the only setting.
token: ""
# Or the name of an existing Secret holding it under the key "token" (then "token" above is not used).
existingSecret: ""

image:
  repository: ghcr.io/koraitech/korai-probe
  tag: ""            # the chart's appVersion
  pullPolicy: IfNotPresent

# The probe keeps its credential and the results waiting to be sent here. Without persistence a restarted pod has
# no credential and needs a new install token.
persistence:
  enabled: true
  size: 256Mi
  storageClass: ""

# Optional: read the SLOWLOG of Redis / Valkey servers in this network (self-hosted, Memorystore, ElastiCache) and
# show it in Korai (Observability > Infrastructure > Redis > Slow commands). Argument values are never sent.
redisSlowlog:
  # redis:// or rediss:// (TLS) URLs, separated by commas: redis://[user:password@]host[:port][?name=label]
  urls: ""
  # Or the name of an existing Secret holding them under the key "urls" (then "urls" above is not used).
  existingSecret: ""
  # A Secret with the CA certificate of the servers under the key "ca.crt" (Memorystore with in-transit encryption).
  caSecret: ""
  # true: also send key patterns (numbers, hex ids and UUIDs masked). Off by default: keys can hold emails, names
  # or tokens that the masking does not catch.
  keys: false

# Only for reaching Korai, never for the checks.
httpsProxy: ""
noProxy: ""

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { memory: 128Mi }

nodeSelector: {}
tolerations: []
affinity: {}
