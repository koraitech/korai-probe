# On a tag vX.Y.Z: the multi-arch image, the Helm chart (OCI) and a GitHub release with the binaries.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'koraitech/korai-probe'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "const version = \"$v\"" main.go || { echo "main.go version is not $v"; exit 1; }
          grep -q "^appVersion: \"$v\"" charts/korai-probe/Chart.yaml || { echo "Chart appVersion is not $v"; exit 1; }
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"
      - name: Release notes exist
        run: grep -qx "## $GITHUB_REF_NAME" CHANGELOG.md || { echo "add a section \"## $GITHUB_REF_NAME\" to CHANGELOG.md"; exit 1; }
      - name: Test
        run: go vet ./... && go test -race -count=1 ./...
      - name: Binaries
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/korai-probe-linux-$arch .
          done
          (cd dist && sha256sum korai-probe-* > SHA256SUMS)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: |
            ghcr.io/koraitech/korai-probe:${{ steps.v.outputs.full }}
            ghcr.io/koraitech/korai-probe:${{ steps.v.outputs.minor }}
            ghcr.io/koraitech/korai-probe:${{ steps.v.outputs.major }}
          labels: |
            org.opencontainers.image.source=https://github.com/koraitech/korai-probe
            org.opencontainers.image.licenses=Apache-2.0
      - uses: azure/setup-helm@v4
      - name: Chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/korai-probe --version "${{ steps.v.outputs.full }}" --app-version "${{ steps.v.outputs.full }}"
          helm push "korai-probe-${{ steps.v.outputs.full }}.tgz" oci://ghcr.io/koraitech/charts
      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # the notes are the tag's section of CHANGELOG.md (from "## vX.Y.Z" to the next "## ")
          awk -v h="## $GITHUB_REF_NAME" '$0==h{on=1;next} on&&/^## /{exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section $GITHUB_REF_NAME"; exit 1; }
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
