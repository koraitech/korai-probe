name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Vet and test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
          go test -race -count=1 ./...
      - uses: azure/setup-helm@v4
      - name: Chart
        run: |
          helm lint charts/korai-probe --set token=kpe1.example
          helm template t charts/korai-probe --set token=kpe1.example > /dev/null
      - name: Image builds
        run: docker build -t korai-probe:ci .
